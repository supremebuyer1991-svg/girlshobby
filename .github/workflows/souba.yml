name: mercari-souba
on:
  schedule:
    - cron: "17 20 * * *"   # 毎日 朝5:17（日本時間）に1回
  workflow_dispatch: {}       # Actionsタブの「Run workflow」で手動実行もできる
permissions:
  contents: write
jobs:
  souba:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright==1.48.0 && python -m playwright install --with-deps chromium
      - run: python bot/bandai_images.py
      - run: python bot/rakuten_card_images.py
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
      - run: python bot/catalog.py
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
      - run: python bot/seal_images.py
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
      - run: python bot/relay_images.py
      - run: python bot/amazon_images.py
        env:
          AMAZON_CREDENTIAL_ID: ${{ secrets.AMAZON_CREDENTIAL_ID }}
          AMAZON_CREDENTIAL_SECRET: ${{ secrets.AMAZON_CREDENTIAL_SECRET }}
          AMAZON_CREDENTIAL_VERSION: ${{ secrets.AMAZON_CREDENTIAL_VERSION }}
      - name: 画像とニュースを先に保存（相場で時間切れになっても消えないように）
        run: |
          git config user.name "souba-bot"
          git config user.email "souba-bot@users.noreply.github.com"
          git add -A site
          git diff --cached --quiet || git commit -m "商品画像とシールニュースを更新"
          git pull --rebase -q origin main && git push
      - run: python bot/mercari_souba.py
        timeout-minutes: 120
      - name: 結果を保存
        run: |
          git add -A site
          git diff --cached --quiet || git commit -m "相場を更新"
          git pull --rebase -q origin main && git push
