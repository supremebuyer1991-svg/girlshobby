# 新しい弾のカード一覧をメルカリの出品から集める（手動で動かす）
name: discover-cards
on:
  workflow_dispatch:
    inputs:
      prefix:
        description: "型番の頭（例 STNGC01）"
        default: "STNGC01"
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright==1.48.0 && python -m playwright install --with-deps chromium
      - run: python tools/discover_cards.py "${{ github.event.inputs.prefix }}"
      - name: 保存
        run: |
          git config user.name "souba-bot"
          git config user.email "souba-bot@users.noreply.github.com"
          git add bot/discovered_*.json
          git diff --cached --quiet || git commit -m "カード一覧の下調べ"
          git pull --rebase -q origin main && git push
