name: site-publish
# site フォルダの中身を GitHub Pages で公開する
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [mercari-souba]   # 毎朝のロボットが終わったら、新しい相場と写真で公開し直す
    types: [completed]
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: 検索用の相場ページを作る
        run: node tools/build_pages.mjs
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
